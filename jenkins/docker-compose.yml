services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins-docker:lts
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      # Mounting the host's Docker socket grants Jenkins effective root on
      # the host. Acceptable for a local learning setup; production uses
      # ephemeral agents or a rootless builder such as Kaniko.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    restart: unless-stopped
    networks:
      - messages-net

volumes:
  jenkins-home:

networks:
  messages-net:
    external: true
    name: messages-app_messages-net